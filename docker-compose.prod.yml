services:
  postgres:
    image: postgres:16-alpine
    container_name: vaija-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vaija}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your environment}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vaija}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_prod_data:
