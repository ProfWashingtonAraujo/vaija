<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <script>
    // Link do cliente (/pedido...): usa o manifest da loja desde o primeiro carregamento, para o app instalado abrir no cardápio.
    (function () {
      var match = /^\/pedido(?:\/([^/]+))?/.exec(location.pathname)
      if (match) document.querySelector('link[rel="manifest"]').href = '/api/public/' + (match[1] && match[1] !== 'checkout' && match[1] !== 'acompanhar' ? match[1] : 'default') + '/manifest.webmanifest'
    })()
  </script>
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#ff6b00" />
  <meta name="description"
    content="Centralize PDV, delivery, cardápio e gestão do seu restaurante em uma plataforma simples e conectada." />
  <meta property="og:title" content="Vaija | Gestão gastronômica em movimento" />
  <meta property="og:description"
    content="Pedidos, caixa, cardápio e resultados em uma única plataforma para restaurantes." />
  <meta property="og:type" content="website" />
  <title>Vaija | Gestão gastronômica em movimento</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
