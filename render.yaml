services:
  - type: web
    name: vaija-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: BACKEND_PORT
        value: 3001
      - key: AUTH_REFRESH_DAYS
        value: 7
      - key: AUTH_COOKIE_SECURE
        value: true
      - key: COOKIE_SAME_SITE
        value: none
      - key: FRONTEND_ORIGIN
        sync: false
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: N8N_ORDER_STATUS_WEBHOOK_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: vaija-postgres
          property: connectionString

  - type: web
    name: vaija-payments
    runtime: python
    plan: free
    buildCommand: cd services/payments && pip install -r requirements.txt
    startCommand: cd services/payments && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vaija-postgres
          property: connectionString
      - key: MERCADO_PAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADO_PAGO_PUBLIC_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: BACKEND_INTERNAL_URL
        sync: false

databases:
  - name: vaija-postgres
    plan: free
