services:
  - type: web
    name: vaija-api
    runtime: go
    rootDir: backend
    plan: free
    buildCommand: mkdir -p bin && go build -trimpath -o bin/api ./cmd/api
    startCommand: ./bin/api
    healthCheckPath: /api/health
    envVars:
      - key: GO_VERSION
        value: 1.23.6
      - key: APP_ENV
        value: production
      - key: SEED_DEMO_DATA
        value: false
      - key: AUTH_REFRESH_DAYS
        value: 7
      - key: AUTH_COOKIE_SECURE
        value: true
      - key: COOKIE_SAME_SITE
        value: none
      - key: FRONTEND_ORIGIN
        sync: false
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: INTERNAL_API_KEY
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: N8N_ORDER_STATUS_WEBHOOK_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: vaija-postgres
          property: connectionString
      - key: REDIS_URL
        sync: false

  - type: web
    name: vaija-payments
    runtime: python
    plan: free
    buildCommand: cd services/payments && pip install -r requirements.txt
    startCommand: cd services/payments && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vaija-postgres
          property: connectionString
      - key: MERCADO_PAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADO_PAGO_PUBLIC_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: BACKEND_INTERNAL_URL
        sync: false
      - key: INTERNAL_API_KEY
        sync: false

  - type: worker
    name: vaija-print-worker
    runtime: python
    plan: free
    buildCommand: cd services/print-worker && pip install -r requirements.txt
    startCommand: cd services/print-worker && python main.py
    envVars:
      - key: REDIS_URL
        sync: false
      - key: PRINTER_IP
        sync: false
      - key: PRINTER_PORT
        value: 9100
      - key: PRINTER_MODEL
        value: epson
      - key: PRINT_COPIES
        value: 1

databases:
  - name: vaija-postgres
    plan: free
