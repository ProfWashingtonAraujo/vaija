services:
  - type: web
    name: vaija-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: BACKEND_PORT
        value: 3001
      - key: AUTH_REFRESH_DAYS
        value: 7
      - key: AUTH_COOKIE_SECURE
        value: true
      - key: COOKIE_SAME_SITE
        value: none
      - key: FRONTEND_ORIGIN
        sync: false
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: N8N_ORDER_STATUS_WEBHOOK_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: vaija-postgres
          property: connectionString

databases:
  - name: vaija-postgres
    plan: free
